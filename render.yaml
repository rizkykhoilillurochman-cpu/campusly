services:
  - type: web
    name: campusly
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/campusly-data
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash
      - key: GEMINI_IMAGE_MODEL
        value: gemini-3.1-flash-image
