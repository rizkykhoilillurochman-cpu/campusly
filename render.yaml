services:
  - type: web
    name: campusly
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/campusly-data
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-2.5-flash-lite,gemini-2.0-flash
      - key: GEMINI_IMAGE_MODEL
        value: gemini-2.5-flash-image
