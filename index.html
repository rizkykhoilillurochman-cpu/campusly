<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<meta name="description" content="Campusly — workspace kuliah untuk tugas, jadwal, catatan, nilai, fokus, dan AI.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-touch-fullscreen" content="yes">
<link rel="manifest" href="/manifest.webmanifest?v=53">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/styles-v2.css?v=53">
<title>Campusly — Student Workspace</title>
</head>
<body>
<div id="app"></div>
<div id="boot-error" hidden></div>
<script>
(()=>{
  const NativeFormData=window.FormData;
  window.FormData=function(el){
    if(el&&el.querySelectorAll&&!(el instanceof HTMLFormElement)){
      const fd=new NativeFormData();
      el.querySelectorAll('input[name],select[name],textarea[name]').forEach(e=>{
        if(e.type==='checkbox'&&!e.checked)return;
        fd.append(e.name,e.value);
      });
      return fd;
    }
    return new NativeFormData(el);
  };
  window.FormData.prototype=NativeFormData.prototype;
  const showBootError=(msg)=>{
    const x=document.getElementById('boot-error');
    if(!x)return;
    x.hidden=false;
    x.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;font-family:system-ui"><div><h1>Campusly belum berhasil dimuat</h1><p>'+String(msg||'Runtime aplikasi tidak dapat dimuat.')+'</p><button onclick="location.reload()">Muat ulang</button></div></div>';
  };
  window.addEventListener('error',e=>{ if(e.error) showBootError(e.error.message||e.error); });
  window.addEventListener('unhandledrejection',e=>showBootError(e.reason?.message||e.reason||'Runtime aplikasi mengalami error.'));
  const load=(src)=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('Runtime aplikasi tidak dapat dimuat: '+src));document.head.appendChild(s);});
  load('/app-v2.js?v=53').then(()=>load('/enhancements.js?v=53')).catch(e=>showBootError(e.message));
})();
</script>
</body>
</html>
