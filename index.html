<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="description" content="Campusly — workspace kuliah untuk tugas, kalender, tools, dan AI.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest?v=80">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/styles.css?v=80">
<link rel="stylesheet" href="/ui-polish.css?v=4">
<link rel="stylesheet" href="/schedule.css?v=4">
<link rel="stylesheet" href="/stability.css?v=2">
<link rel="stylesheet" href="/ux-fix.css?v=2">
<style>
html,body{margin:0;background:#0b0d12;color:#f7f8fb}#app{min-height:100vh}.boot-error{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center;font-family:system-ui,-apple-system,sans-serif;background:#0b0d12;color:#f7f8fb}.boot-error p{color:#aeb5c2;max-width:560px}.boot-error button{border:0;border-radius:14px;padding:12px 18px;font-weight:700;cursor:pointer}.tools-page{padding-bottom:18px}.tools-page h1{font-size:clamp(36px,6vw,58px);line-height:.98;letter-spacing:-.06em;margin:4px 0 10px}.tools-page>p{color:var(--muted);font-size:16px;margin:0;max-width:680px}.tool-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}.tool-grid button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:22px;padding:17px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px;min-height:120px;cursor:pointer}.tool-grid small{color:var(--muted);font-size:12px}@media(max-width:950px){.tool-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.tool-grid{grid-template-columns:1fr}}
</style>
<title>Campusly</title>
</head>
<body>
<div id="app"><div class="boot-error"><div><h1>Campusly lagi nyiapin workspace…</h1><p>Kalau layar ini nggak hilang, tekan muat ulang.</p><button onclick="location.reload()">Muat ulang</button></div></div></div>
<noscript>Campusly membutuhkan JavaScript untuk berjalan.</noscript>
<script>
(()=>{
  const app=document.getElementById('app');
  const fatal=message=>{if(!app)return;app.innerHTML='<div class="boot-error"><div><h1>Campusly belum berhasil dimuat</h1><p>'+String(message||'Runtime aplikasi tidak dapat dimuat.').replace(/[<>]/g,'')+'</p><button onclick="location.reload()">Muat ulang</button></div></div>'};
  const load=(src,onload,onerror)=>{const s=document.createElement('script');s.src=src;s.onload=()=>onload?.();s.onerror=()=>onerror?.(src);document.body.appendChild(s)};
  const optional=(src,next)=>load(src,next,failed=>{console.warn('Campusly optional module gagal dimuat:',failed);next?.()});

  // Cuma app.js yang fatal. Semua enhancement/tool/schedule boleh gagal tanpa bikin blank screen.
  load('/app.js?v=80',()=>{
    try{window.render?.()}catch(e){console.error(e);fatal(e?.message)}
    optional('/enhancements.js?v=80',()=>{
      try{window.render?.()}catch(e){console.error('enhancements render error',e)}
      optional('/final-polish.js?v=80',()=>{
        optional('/developer-contact.js?v=80',()=>{
          optional('/finance.js?v=80',()=>{
            optional('/fixes.js?v=2',()=>{
              optional('/first-run.js?v=2',()=>{
                optional('/runtime-fix.js?v=2',()=>{
                  // Jadwal adalah enhancement tambahan; tidak pernah boleh memblokir app utama.
                  optional('/schedule.js?v=4',()=>{try{window.render?.()}catch(e){console.error('final render error',e)}})
                })
              })
            })
          })
        })
      })
    })
  },failed=>fatal('Modul utama Campusly gagal dimuat: '+failed));
})();
</script>
</body>
</html>
