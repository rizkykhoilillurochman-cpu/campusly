<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<meta name="description" content="Campusly — workspace kuliah untuk tugas, kalender, catatan, dan AI.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-touch-fullscreen" content="yes">
<link rel="manifest" href="/manifest.webmanifest?v=61">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/styles.css?v=61">
<title>Campusly — Student Workspace</title>
</head>
<body>
<div id="app"></div>
<noscript>Campusly membutuhkan JavaScript untuk berjalan.</noscript>
<script>
(()=>{
  const show=(message)=>{document.getElementById('app').innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;font-family:system-ui"><div><h1>Campusly belum berhasil dimuat</h1><p>'+String(message||'Runtime aplikasi tidak dapat dimuat.')+'</p><button onclick="location.reload()">Muat ulang</button></div></div>'};
  window.addEventListener('error',e=>{if(e.error)show(e.error.message||'Runtime aplikasi mengalami error.')});
  window.addEventListener('unhandledrejection',e=>show(e.reason?.message||e.reason||'Runtime aplikasi mengalami error.'));
  const s=document.createElement('script');s.src='/app.js?v=61';s.onerror=()=>show('Runtime aplikasi tidak dapat dimuat: /app.js?v=61');document.body.appendChild(s);
})();
</script>
</body>
</html>
