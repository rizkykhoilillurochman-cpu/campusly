<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060a18">
<meta name="description" content="Campusly — Your College Life, Smarter">
<link rel="manifest" href="/manifest.json?v=21">
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/styles.css?v=21">
<link rel="stylesheet" href="/mobile-menu.css?v=1">
<title>Campusly</title>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  try{
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})}).catch(function(){});
    }
    if(window.caches){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})}).catch(function(){})}
  }catch(e){}
})();
</script>
<script src="/app.js?v=21"></script>
</body>
</html>
