.main{min-width:0!important}.topbar{height:82px!important;padding:0 10px 0 10px!important;border:0!important;background:transparent!important;backdrop-filter:none!important;position:sticky!important;top:0!important}.search{width:min(650px,62vw)!important;padding:13px 18px!important;border-radius:22px!important;background:rgba(255,255,255,.28)!important;border:1px solid rgba(255,255,255,.58)!important;box-shadow:0 14px 35px rgba(60,93,135,.14),inset 0 1px 0 rgba(255,255,255,.8)!important;backdrop-filter:blur(28px) saturate(150%)!important}.search input{font-size:14px!important}.search input::placeholder{color:rgba(255,255,255,.88)!important}.cmd{background:rgba(255,255,255,.20);color:#fff!important;border-color:rgba(255,255,255,.35)!important}.avatar{width:48px!important;height:48px!important;background:linear-gradient(135deg,#f7fbff,#c9d9ff)!important;border:2px solid rgba(255,255,255,.72)!important;color:#5864e5!important}

.bottom-grid{grid-template-columns:1.35fr .65fr!important;gap:16px!important}.progress-card{min-height:230px!important}.progress-ring{background:conic-gradient(#58d9ff var(--pct),rgba(255,255,255,.18) 0)!important;box-shadow:inset 0 0 0 12px rgba(255,255,255,.08),0 10px 28px rgba(46,85,126,.16)!important}.progress-ring:after{background:rgba(150,184,223,.36)!important}.quote-card{display:flex;flex-direction:column;justify-content:center;min-height:230px!important;background:linear-gradient(145deg,rgba(57,107,159,.34),rgba(102,166,205,.20))!important}.quote-card h2{font-size:24px!important;line-height:1.2!important}.quote-card p{color:rgba(255,255,255,.75)!important}
.liquid-side .glass{padding:20px!important}.liquid-side .card-head{margin-bottom:8px!important}.link-btn{border:1px solid rgba(255,255,255,.34);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:8px 12px}.side-task{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:center;padding:15px 0;border-bottom:1px solid rgba(255,255,255,.20)}.side-task:last-child{border-bottom:0}.side-task b,.class-row b{font-size:13px}.side-task small,.class-row small{display:block;margin-top:4px;color:rgba(255,255,255,.70);font-size:11px}.side-task em{font-style:normal;font-size:10px;padding:7px 10px;border-radius:999px;background:linear-gradient(135deg,rgba(255,122,177,.62),rgba(185,100,255,.52));border:1px solid rgba(255,255,255,.28)}.task-dot{width:19px;height:19px;border:1px solid rgba(255,255,255,.55);border-radius:50%;background:rgba(255,255,255,.10)}.class-row{display:grid;grid-template-columns:74px 1fr;gap:12px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.17)}.class-row:last-child{border-bottom:0}.time{font-size:12px;font-weight:800;color:#fff}.row{border-bottom-color:rgba(255,255,255,.16)!important}.pill,.btn,.glass-button{background:rgba(255,255,255,.18)!important;border-color:rgba(255,255,255,.38)!important;color:#fff!important}.btn.primary{background:linear-gradient(135deg,#5f78ff,#b16dff)!important;border-color:rgba(255,255,255,.55)!important;box-shadow:0 12px 30px rgba(86,94,240,.28)!important}.btn.danger{background:rgba(255,100,140,.20)!important}.field input,.field select,.field textarea{background:rgba(255,255,255,.22)!important;border-color:rgba(255,255,255,.42)!important;color:#fff!important}.field input::placeholder,.field textarea::placeholder{color:rgba(255,255,255,.70)!important}
.ai-layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px}.ai-chat{min-height:610px;padding:0!important;display:flex;flex-direction:column;overflow:hidden}.ai-messages{flex:1;overflow:auto;padding:28px}.ai-welcome{text-align:center;max-width:620px;margin:60px auto}.ai-welcome h2{font-size:30px}.ai-welcome p{color:rgba(255,255,255,.78)}.ai-input-wrap{display:flex;gap:10px;padding:14px;border-top:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.12)}.ai-input-wrap textarea{flex:1;resize:none;border:1px solid rgba(255,255,255,.38);border-radius:18px;background:rgba(255,255,255,.22);color:#fff;padding:13px 15px;outline:0}.send-ai{width:48px;height:48px;border:0;border-radius:16px;background:linear-gradient(135deg,#6578ff,#ad6dff);color:#fff;font-size:22px}.msg{max-width:78%;padding:12px 15px;border-radius:18px;margin:10px 0;line-height:1.5}.msg.user{margin-left:auto;background:linear-gradient(135deg,rgba(92,125,255,.78),rgba(169,102,255,.70))}.msg.ai{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.22)}.ai-context{padding:22px!important}.context-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.16)}.context-item>span{width:38px;height:38px;display:grid;place-items:center;border-radius:13px;background:rgba(255,255,255,.20)}.context-item small{display:block;color:rgba(255,255,255,.68)}.context-item b{font-size:18px}.ai-context hr{border:0;border-top:1px solid rgba(255,255,255,.16);margin:16px 0}

@media(max-width:620px){.app{padding-left:7px!important;padding-right:7px!important}.search{width:100%!important}.topbar>.avatar{display:none}.glass-grid,.liquid-side,.bottom-grid{grid-template-columns:1fr!important}.hero-title{font-size:34px!important}.stat-card{min-height:125px!important}.ai-hero .glass-button{display:none}.quick-actions{grid-template-columns:1fr 1fr!important}.ai-layout{gap:10px}.msg{max-width:90%}}

<body>
<div id="app"></div>
<script src="/app.js?v=9"></script>
<script>
(function(){
const esc0=window.esc||function(s=''){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))};
function dateLabel(){return new Intl.DateTimeFormat('id-ID',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}).format(new Date())}
function taskTime(x){return esc0(x.deadline||x.time||'Tanpa deadline')}
function todayClasses(){const all=state.schedule||[];const day=new Intl.DateTimeFormat('id-ID',{weekday:'long'}).format(new Date());const key=day.slice(0,3).toLowerCase();return all.filter(c=>String(c.day||'').toLowerCase().startsWith(key)||String(c.day||'').toLowerCase()===day.toLowerCase()).sort((a,b)=>String(a.start||'').localeCompare(String(b.start||'')))}
function financeTotal(){return (state.finance||[]).reduce((n,x)=>n+Number(x.amount||0),0)}
function liquidHome(){const p=state.profile||{};const tasks=(state.tasks||[]).filter(x=>!x.done);const classes=todayClasses();const pct=Math.min(100,Math.round(((p.credits||0)/(p.totalCredits||144))*100));const saldo=financeTotal();return `<div class="liquid-home"><div class="liquid-shell"><div class="liquid-main"><div class="hero glass"><div><div class="eyebrow">SELAMAT DATANG KEMBALI,</div><h1 class="hero-title">${esc0(p.preferredName||p.name||'Rizky')} <span>👋</span></h1><p>“Hari ini adalah hari yang baik untuk melangkah lebih maju. Keep going!”</p></div><div class="hero-meta"><span>☀️ 28°C &nbsp; Cerah</span><span>⌖ Jakarta</span></div></div><div class="glass-grid"><div class="glass stat-card"><span>🎓 &nbsp;Semester</span><b>${p.semester||1}</b><small>/ 8</small><div class="mini-progress"><i style="width:${Math.min(100,Number(p.semester||1)/8*100)}%"></i></div></div><div class="glass stat-card"><span>📈 &nbsp;IPK</span><b>${p.gpa?Number(p.gpa).toFixed(2):'—'}</b><small>${p.gpa?'Saat ini':'Belum ada data'}</small></div><div class="glass stat-card"><span>🎯 &nbsp;Target IPK</span><b>${Number(p.targetGpa||3.75).toFixed(2)}</b><div class="mini-progress"><i style="width:${Math.min(100,Number(p.targetGpa||3.75)/4*100)}%"></i></div></div><div class="glass stat-card"><span>✓ &nbsp;Tugas Tersisa</span><b>${tasks.length}</b><small>${tasks.length?'Dari '+tasks.length+' tugas aktif':'Clean slate ✨'}</small></div></div><div class="glass ai-hero"><div class="ai-orb">✦</div><div class="ai-copy"><div class="eyebrow">CAMPUSLY AI</div><h2>AI Assistant</h2><p>Teman belajar lo 24/7. Dapatkan bantuan untuk tugas, rangkuman materi, penjelasan konsep, dan banyak lagi.</p></div><button class="glass-button" onclick="go('ai')">Buka AI →</button><div class="ai-prompt" onclick="go('ai')">Tanyakan sesuatu... <span>⌘ K</span></div><div class="chips"><button class="chip" onclick="go('ai');setTimeout(()=>quickAI('Ringkas materi kuliah saya'),80)">📚 &nbsp;Ringkas materi</button><button class="chip" onclick="go('ai');setTimeout(()=>quickAI('Bantu kerjain tugas saya'),80)">✨ &nbsp;Bantu kerjain tugas</button><button class="chip" onclick="go('ai');setTimeout(()=>quickAI('Buat rencana belajar minggu ini'),80)">🗓️ &nbsp;Buat rencana belajar</button><button class="chip" onclick="go('ai');setTimeout(()=>quickAI('Jelaskan konsep yang sulit dengan sederhana'),80)">💡 &nbsp;Jelaskan konsep</button></div></div><div class="quick-actions glass"><button onclick="openNote()">✎<span>Buat Catatan</span><small>AI Note</small></button><button onclick="openTask()">✓<span>Tambah Tugas</span><small>Quick Add</small></button><button onclick="openClass()">◫<span>Buat Jadwal</span><small>AI Schedule</small></button><button onclick="go('gpa')">∑<span>Hitung IPK</span><small>GPA Tracker</small></button></div><div class="bottom-grid"><div class="glass progress-card"><div class="card-head"><h2>Progress Kuliah</h2><span class="pill">${pct}%</span></div><div class="progress-ring" style="--pct:${pct}%"><strong>${pct}%</strong><span>Selesai</span></div><div class="course-bars">${(state.courses||[]).slice(0,4).map(c=>`<div><span>${esc0(c.name)}</span><i><b style="width:${Math.min(100,Number(c.progress||0))}%"></b></i></div>`).join('')||'<div class="muted">Tambahkan mata kuliah untuk melihat progress.</div>'}</div></div><div class="glass quote-card"><span>✦</span><h2>Disiplin hari ini,<br>kesuksesan esok.</h2><p>— Campusly</p></div></div></div><aside class="liquid-side"><div class="glass"><div class="card-head"><div><h2>Hari Ini</h2><small class="muted">${dateLabel()}</small></div><button class="link-btn" onclick="go('calendar')">Lihat Semua</button></div>${tasks.slice(0,4).map(x=>`<div class="side-task"><span class="task-dot"></span><div><b>${esc0(x.title)}</b><small>${taskTime(x)}</small></div><em>${esc0(x.priority||'Tugas')}</em></div>`).join('')||'<div class="empty">Tidak ada agenda hari ini. ✨</div>'}</div><div class="glass"><div class="card-head"><h2>Jadwal Kuliah</h2><button class="link-btn" onclick="go('schedule')">Lihat Semua</button></div>${classes.slice(0,6).map(c=>`<div class="class-row"><span class="time">${esc0(c.start||'--:--')}</span><div><b>${esc0(c.name)}</b><small>${esc0(c.room||'')} ${c.end?'· '+esc0(c.end):''}</small></div></div>`).join('')||'<div class="empty">Belum ada jadwal untuk hari ini.</div>'}</div><div class="glass quote-card"><span>🌿</span><h2>“Langkah kecil hari ini,<br>hasil besar nanti.”</h2><p>Campusly</p></div><div class="glass"><div class="card-head"><h2>Keuangan</h2><span class="pill">+12%</span></div><div class="stat-value">Rp ${saldo.toLocaleString('id-ID')}</div><div class="progress"><span style="width:72%"></span></div><p class="muted">Total saldo tercatat</p><button class="link-btn" onclick="go('finance')">Lihat Detail →</button></div></aside></div></div>`}
function aiPage2(){return `${header('CAMPUSLY AI','AI Study Companion','Satu tempat buat nanya, mikir, dan beresin kuliah lo.',`<span class="pill">AI aktif</span>`)}<div class="ai-layout"><div class="glass ai-chat"><div id="aiMessages" class="ai-messages"><div class="ai-welcome"><div class="ai-orb large">✦</div><h2>Halo ${esc0(state.profile?.preferredName||'Rizky')} 👋</h2><p>Gue bisa bantu jelasin materi, bikin rencana belajar, brainstorming tugas, atau ngerapihin ide.</p><div class="chips"><button class="chip" onclick="quickAI('Buatkan rencana belajar 7 hari untuk saya')">📅 Rencana belajar 7 hari</button><button class="chip" onclick="quickAI('Bantu saya memahami materi yang sulit')">🧠 Pahami materi</button><button class="chip" onclick="quickAI('Bantu saya menyusun tugas kuliah')">✍️ Susun tugas</button></div></div></div><form class="ai-input-wrap" onsubmit="sendAI2(event)"><textarea id="aiInput" rows="2" placeholder="Tanya apa saja tentang kuliah lo..."></textarea><button class="send-ai" type="submit">↑</button></form></div><aside class="glass ai-context"><h3>Konteks lo</h3><div class="context-item"><span>🎓</span><div><small>Semester</small><b>${state.profile?.semester||1}</b></div></div><div class="context-item"><span>🎯</span><div><small>Target IPK</small><b>${Number(state.profile?.targetGpa||3.75).toFixed(2)}</b></div></div><div class="context-item"><span>✓</span><div><small>Tugas aktif</small><b>${(state.tasks||[]).filter(x=>!x.done).length}</b></div></div><hr><p class="muted">AI memakai konteks profil dan data akademik yang tersedia di Campusly.</p></aside></div>`}
window.home=liquidHome;window.ai=aiPage2;
window.quickAI=function(text){const el=document.getElementById('aiInput');if(el){el.value=text;el.focus()}else{go('ai');setTimeout(()=>quickAI(text),80)}};
async function ensureAiToken(){let t=localStorage.getItem('campusly_ai_token');if(t)return t;const seed=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()).replace(/-/g,'').slice(0,24);const email='guest_'+seed+'@campusly.app';const password='Cly!'+seed+'9x';const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Gagal menyiapkan sesi AI');localStorage.setItem('campusly_ai_token',d.token);return d.token}
window.sendAI2=async function(e){e.preventDefault();const input=document.getElementById('aiInput'),box=document.getElementById('aiMessages'),text=(input?.value||'').trim();if(!text)return;input.value='';const welcome=box.querySelector('.ai-welcome');if(welcome)welcome.remove();const user=document.createElement('div');user.className='msg user';user.innerHTML='<div>'+esc0(text)+'</div>';box.appendChild(user);const wait=document.createElement('div');wait.className='msg ai';wait.innerHTML='<div>Campusly AI sedang mikir <span>•••</span></div>';box.appendChild(wait);box.scrollTop=box.scrollHeight;try{let token=await ensureAiToken();let r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({messages:[{role:'system',content:'Kamu adalah Campusly AI, asisten akademik mahasiswa. Jawab dalam Bahasa Indonesia yang santai, jelas, praktis, dan aman. Nama mahasiswa: '+(state.profile?.preferredName||state.profile?.name||'Rizky')+'. Semester: '+(state.profile?.semester||1)+'. Target IPK: '+(state.profile?.targetGpa||3.75)+'. Tugas aktif: '+((state.tasks||[]).filter(x=>!x.done).length)+'.'},{role:'user',content:text}]})});if(r.status===401){localStorage.removeItem('campusly_ai_token');token=await ensureAiToken();r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({messages:[{role:'user',content:text}]})})}const d=await r.json();if(!r.ok)throw new Error(d.error||'AI gagal merespons');wait.innerHTML='<div>'+esc0(d.text||'AI tidak memberi jawaban.')+'</div>'}catch(err){wait.innerHTML='<div><b>AI belum bisa menjawab.</b><br><span class="muted">'+esc0(err.message)+'</span></div>'}box.scrollTop=box.scrollHeight};
})();
</script>
