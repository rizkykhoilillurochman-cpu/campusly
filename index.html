<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<meta name="description" content="Campusly — workspace kuliah untuk tugas, kalender, catatan, dan AI.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-touch-fullscreen" content="yes">
<link rel="manifest" href="/manifest.webmanifest?v=63">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/styles.css?v=63">
<title>Campusly</title>
</head>
<body>
<div id="app"></div>
<noscript>Campusly membutuhkan JavaScript untuk berjalan.</noscript>
<script>
(()=>{
  const show=message=>{const app=document.getElementById('app');if(app)app.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;font-family:system-ui"><div><h1>Campusly belum berhasil dimuat</h1><p>'+String(message||'Runtime aplikasi tidak dapat dimuat.')+'</p><button onclick="location.reload()">Muat ulang</button></div></div>'};
  window.addEventListener('error',e=>{if(e.error)show(e.error.message||'Runtime aplikasi mengalami error.')});
  window.addEventListener('unhandledrejection',e=>show(e.reason?.message||e.reason||'Runtime aplikasi mengalami error.'));
  const enhance=()=>{
    document.getElementById('campusly-back')?.remove();
    if(!location.hash||location.hash==='#home')return;
    const tools=document.querySelector('.page-tools');
    if(!tools||tools.querySelector('.back-inline'))return;
    const b=document.createElement('button');
    b.type='button';b.className='back-inline';b.innerHTML='<span aria-hidden="true">‹</span><span>Kembali</span>';
    b.onclick=()=>{if(history.length>1)history.back();else window.go?.('home')};
    tools.prepend(b);
  };
  addEventListener('hashchange',()=>setTimeout(enhance,0));
  const s=document.createElement('script');s.src='/app.js?v=63';s.onload=()=>setTimeout(enhance,0);s.onerror=()=>show('Runtime aplikasi tidak dapat dimuat: /app.js?v=63');document.body.appendChild(s);
})();
</script>
</body>
</html>
