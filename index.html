<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<meta name="description" content="Campusly — workspace kuliah untuk tugas, kalender, catatan, dan AI.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-touch-fullscreen" content="yes">
<link rel="manifest" href="/manifest.webmanifest?v=62">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/styles.css?v=62">
<title>Campusly — Student Workspace</title>
</head>
<body>
<div id="app"></div>
<noscript>Campusly membutuhkan JavaScript untuk berjalan.</noscript>
<script>
(()=>{
  const NativeFormData=window.FormData;
  window.FormData=function(el){
    if(el&&el.querySelectorAll&&!(el instanceof HTMLFormElement)){
      const fd=new NativeFormData();
      el.querySelectorAll('input[name],select[name],textarea[name]').forEach(e=>{
        if(e.type==='checkbox'&&!e.checked)return;
        fd.append(e.name,e.value);
      });
      return fd;
    }
    return new NativeFormData(el);
  };
  window.FormData.prototype=NativeFormData.prototype;
  const show=(message)=>{document.getElementById('app').innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;font-family:system-ui"><div><h1>Campusly belum berhasil dimuat</h1><p>'+String(message||'Runtime aplikasi tidak dapat dimuat.')+'</p><button onclick="location.reload()">Muat ulang</button></div></div>'};
  window.addEventListener('error',e=>{if(e.error)show(e.error.message||'Runtime aplikasi mengalami error.')});
  window.addEventListener('unhandledrejection',e=>show(e.reason?.message||e.reason||'Runtime aplikasi mengalami error.'));
  const s=document.createElement('script');
  s.src='/app.js?v=62';
  s.onerror=()=>show('Runtime aplikasi tidak dapat dimuat: /app.js?v=62');
  s.onload=()=>{
    const back=document.createElement('button');
    back.id='campusly-back';back.type='button';back.textContent='‹ Kembali';
    back.style.cssText='position:fixed;top:76px;left:14px;z-index:35;border:1px solid var(--line,#dfe3e8);background:var(--surface,#fff);color:var(--text,#17191d);border-radius:999px;padding:7px 11px;font:700 12px system-ui;display:none;box-shadow:0 6px 18px rgba(0,0,0,.08)';
    back.onclick=()=>{if(history.length>1)history.back();else window.go?.('home')};
    document.body.append(back);
    const sync=()=>{back.style.display=location.hash&&location.hash!=='#home'?'block':'none'};
    addEventListener('hashchange',sync);sync();
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
