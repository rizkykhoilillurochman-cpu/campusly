<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><meta name="description" content="Campusly - academic planner, tasks, notes, schedule and GPA tracker"><link rel="manifest" href="manifest.json"><title>Campusly</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#101828;--muted:#667085;--line:#e4e7ec;--primary:#5b5cf0;--primary2:#4747d1;--soft:#eef0ff;--danger:#d92d20;--ok:#079455;--shadow:0 10px 30px rgba(16,24,40,.07)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:22px}.top{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;position:sticky;top:0;z-index:10;background:rgba(245,247,251,.94);backdrop-filter:blur(12px);padding:10px 0}.logo{width:46px;height:46px;border-radius:15px;background:#111827;color:#fff;display:grid;place-items:center;font-weight:900}.brand{font-size:24px;font-weight:850}.sub,.muted{color:var(--muted)}.nav{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}.nav button{border:0;border-radius:10px;padding:9px 12px;background:#e9ebf0;color:#344054;cursor:pointer;font-weight:650}.nav button.active,.primary{background:var(--primary)!important;color:#fff!important}.nav button:hover,.btn:hover{filter:brightness(.98)}.hero,.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow)}.hero{margin-bottom:16px}h1{font-size:32px;margin:0 0 8px}h2{font-size:22px;margin:0 0 14px}h3{margin:0 0 6px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px}.value{font-size:27px;font-weight:850;margin-top:5px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;padding:10px 14px;background:#eaecf0;color:#344054;text-decoration:none;cursor:pointer;font-weight:700}.btn.danger{background:#fee4e2;color:var(--danger)}.btn.ghost{background:transparent;border:1px solid var(--line)}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tab{white-space:nowrap;border:0;background:#eaecf0;border-radius:10px;padding:9px 13px;cursor:pointer;font-weight:700}.tab.active{background:var(--soft);color:#3538cd}.section{display:none}.section.active{display:block}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:750;color:#344054}.field input,.field select,.field textarea{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:11px 12px;font:inherit;background:#fff;color:var(--text);outline:none}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px #eef0ff}.list{display:grid;gap:10px;margin-top:14px}.item{border:1px solid var(--line);border-radius:15px;padding:15px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.item.done{opacity:.65}.item-main{min-width:0}.item-title{font-weight:800}.item-meta{font-size:13px;color:var(--muted);margin-top:5px}.item-actions{display:flex;gap:6px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800;background:#eef0f3;color:#475467;margin-left:5px}.badge.high{background:#fee4e2;color:#b42318}.badge.medium{background:#fff0c2;color:#8a5b00}.badge.low{background:#dff8eb;color:#067647}.empty{text-align:center;border:1px dashed #d0d5dd;border-radius:14px;padding:28px;color:var(--muted)}.two{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:14px}.table th{color:var(--muted);font-size:12px;text-transform:uppercase}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:12px 15px;border-radius:12px;box-shadow:var(--shadow);display:none;z-index:50}.toast.show{display:block}.small{font-size:13px}.progress{height:9px;background:#eaecf0;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--primary);border-radius:99px}.ai-answer{white-space:pre-wrap;background:#f8f9fc;border:1px solid var(--line);border-radius:14px;padding:15px;min-height:80px}.install{display:none}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.nav{margin-left:0;width:100%}.form{grid-template-columns:1fr}}@media(max-width:480px){.wrap{padding:14px}.grid{grid-template-columns:1fr}.item{flex-direction:column}.item-actions{width:100%}.item-actions .btn{flex:1}.hero,.panel{padding:17px}h1{font-size:27px}}
</style></head>
<body><main class="wrap">
<header class="top"><div class="logo">C</div><div><div class="brand">Campusly</div><div class="sub">Your Academic Journey, Simplified.</div></div><nav class="nav" id="nav"></nav></header>
<div id="app"></div><div id="toast" class="toast"></div>
</main>
<script>
(()=>{
'use strict';
const KEY='campusly.v1';
const defaults={profile:{name:'Rizky',nim:'',major:'',semester:1,target:3.75},tasks:[],notes:[],schedule:[],courses:[]};
let state=load(), current='home', editing=null;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function load(){try{return Object.assign({},defaults,JSON.parse(localStorage.getItem(KEY)||'{}'),{profile:Object.assign({},defaults.profile,(JSON.parse(localStorage.getItem(KEY)||'{}').profile||{}))})}catch(e){return JSON.parse(JSON.stringify(defaults))}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));toast('Tersimpan ✓')}
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function nav(){let items=[['home','Home'],['tasks','Tasks'],['notes','Notes'],['schedule','Jadwal'],['gpa','GPA'],['ai','AI'],['profile','Profil']];$('#nav').innerHTML=items.map(x=>`<button class="${current===x[0]?'active':''}" data-go="${x[0]}">${x[1]}</button>`).join('')}
function layout(){nav();let views={home:home,tasks:tasks,notes:notes,schedule:schedule,gpa:gpa,ai:ai,profile:profile};$('#app').innerHTML=views[current]();bind();}
function home(){let p=state.profile, open=state.tasks.filter(x=>!x.done).length, due=state.tasks.filter(x=>!x.done&&x.due&&x.due<new Date().toISOString().slice(0,10)).length, g=calcGpa();return `<section class="hero"><div class="muted">DASHBOARD</div><h1>Halo, ${esc(p.name||'Mahasiswa')} 👋</h1><p class="muted">Semua data Campusly disimpan lokal di browser ini. Tidak perlu Google untuk memakainya.</p><div class="grid"><div class="card"><div class="muted">Semester</div><div class="value">${esc(p.semester)}</div></div><div class="card"><div class="muted">GPA</div><div class="value">${g?g.toFixed(2):'—'}</div></div><div class="card"><div class="muted">Target GPA</div><div class="value">${Number(p.target||0).toFixed(2)}</div></div><div class="card"><div class="muted">Tasks aktif</div><div class="value">${open}</div></div></div><div class="actions"><button class="btn primary" data-go="tasks" data-new="task">+ Tambah Task</button><button class="btn" data-go="profile">Atur Profil</button></div></section><section class="panel"><h2>Ringkasan</h2><div class="two"><div><p><b>${state.notes.length}</b> catatan tersimpan</p><p><b>${state.schedule.length}</b> jadwal kuliah</p><p><b>${state.courses.length}</b> mata kuliah di GPA</p></div><div><div class="small muted">Progress tugas</div><div class="progress" style="margin-top:8px"><div style="width:${state.tasks.length?Math.round(state.tasks.filter(x=>x.done).length/state.tasks.length*100):0}%"></div></div><p class="small muted">${state.tasks.filter(x=>x.done).length}/${state.tasks.length} selesai${due?` · ${due} lewat deadline`:''}</p></div></div></section>`}
function tasks(){return `<section class="panel"><h1>Tasks</h1><p class="muted">Tambah, tandai selesai, edit, hapus, dan filter tugas kuliah.</p><form id="taskForm" class="form"><div class="field"><label>Nama tugas</label><input name="title" required placeholder="Contoh: Makalah Ekonomi Mikro" value="${editing?esc(editing.title):''}"></div><div class="field"><label>Mata kuliah</label><input name="course" placeholder="Contoh: Ekonomi Mikro" value="${editing?esc(editing.course):''}"></div><div class="field"><label>Deadline</label><input type="date" name="due" value="${editing?esc(editing.due):''}"></div><div class="field"><label>Prioritas</label><select name="priority"><option ${editing?.priority==='high'?'selected':''} value="high">Tinggi</option><option ${!editing||editing.priority==='medium'?'selected':''} value="medium">Sedang</option><option ${editing?.priority==='low'?'selected':''} value="low">Rendah</option></select></div><div class="actions full"><button class="btn primary">${editing?'Simpan perubahan':'Tambah Task'}</button>${editing?'<button type="button" class="btn" id="cancelEdit">Batal</button>':''}</div></form></section><section class="panel"><div class="actions" style="margin-top:0"><button class="tab active" data-filter="all">Semua</button><button class="tab" data-filter="open">Aktif</button><button class="tab" data-filter="done">Selesai</button></div><div id="taskList" class="list">${taskList()}</div></section>`}
function taskList(filter='all'){let a=state.tasks.filter(x=>filter==='all'||(filter==='done'?x.done:!x.done)).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));if(!a.length)return '<div class="empty">Belum ada task di filter ini.</div>';return a.map(x=>`<div class="item ${x.done?'done':''}"><div class="item-main"><div class="item-title">${esc(x.title)} <span class="badge ${x.priority||'medium'}">${x.priority==='high'?'Tinggi':x.priority==='low'?'Rendah':'Sedang'}</span></div><div class="item-meta">${esc(x.course||'Tanpa mata kuliah')} · ${x.due?new Date(x.due+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'Tanpa deadline'}</div></div><div class="item-actions"><button class="btn" data-task-done="${x.id}">${x.done?'Buka lagi':'Selesai'}</button><button class="btn" data-task-edit="${x.id}">Edit</button><button class="btn danger" data-task-del="${x.id}">Hapus</button></div></div>`).join('')}
function notes(){return `<section class="panel"><h1>Notes</h1><p class="muted">Catatan kuliah, ide, atau rangkuman pribadi.</p><form id="noteForm" class="form"><div class="field"><label>Judul</label><input name="title" required placeholder="Judul catatan"></div><div class="field"><label>Mata kuliah</label><input name="course" placeholder="Opsional"></div><div class="field full"><label>Isi catatan</label><textarea name="body" required placeholder="Tulis catatan di sini..."></textarea></div><div class="actions"><button class="btn primary">Simpan Catatan</button></div></form></section><section class="panel"><h2>Catatan tersimpan</h2><div class="list">${state.notes.length?state.notes.map(n=>`<div class="item"><div class="item-main"><div class="item-title">${esc(n.title)}</div><div class="item-meta">${esc(n.course||'Umum')} · ${new Date(n.created).toLocaleDateString('id-ID')}</div><p>${esc(n.body)}</p></div><div class="item-actions"><button class="btn danger" data-note-del="${n.id}">Hapus</button></div></div>`).join(''):'<div class="empty">Belum ada catatan.</div>'}</div></section>`}
function schedule(){let days=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];return `<section class="panel"><h1>Jadwal</h1><p class="muted">Simpan jadwal kuliah mingguan.</p><form id="scheduleForm" class="form"><div class="field"><label>Hari</label><select name="day">${days.map(d=>`<option>${d}</option>`).join('')}</select></div><div class="field"><label>Jam</label><input type="time" name="time" required></div><div class="field"><label>Mata kuliah</label><input name="course" required placeholder="Nama mata kuliah"></div><div class="field"><label>Ruangan</label><input name="room" placeholder="Contoh: R.204"></div><div class="actions"><button class="btn primary">Tambah Jadwal</button></div></form></section><section class="panel"><h2>Jadwal minggu ini</h2><div class="list">${state.schedule.length?state.schedule.sort((a,b)=>days.indexOf(a.day)-days.indexOf(b.day)||a.time.localeCompare(b.time)).map(s=>`<div class="item"><div class="item-main"><div class="item-title">${esc(s.course)}</div><div class="item-meta">${s.day} · ${s.time}${s.room?' · '+esc(s.room):''}</div></div><div class="item-actions"><button class="btn danger" data-schedule-del="${s.id}">Hapus</button></div></div>`).join(''):'<div class="empty">Belum ada jadwal.</div>'}</div></section>`}
const grades={A:4,'A-':3.75,'B+':3.5,B:3,'B-':2.75,'C+':2.5,C:2,'C-':1.75,D:1,E:0};
function calcGpa(){let a=state.courses.filter(x=>Number(x.credits)>0&&grades[x.grade]!=null);if(!a.length)return 0;let c=a.reduce((s,x)=>s+Number(x.credits),0);return a.reduce((s,x)=>s+grades[x.grade]*Number(x.credits),0)/c}
function gpa(){let g=calcGpa();return `<section class="panel"><h1>GPA Calculator</h1><p class="muted">Masukkan SKS dan nilai. GPA dihitung otomatis dan tersimpan lokal.</p><div class="card" style="margin-bottom:14px"><div class="muted">GPA saat ini</div><div class="value">${g?g.toFixed(2):'—'}</div></div><form id="courseForm" class="form"><div class="field"><label>Mata kuliah</label><input name="name" required placeholder="Contoh: Statistika"></div><div class="field"><label>SKS</label><input name="credits" type="number" min="1" max="12" value="3" required></div><div class="field"><label>Nilai</label><select name="grade">${Object.keys(grades).map(x=>`<option>${x}</option>`).join('')}</select></div><div class="actions"><button class="btn primary">Tambah Mata Kuliah</button></div></form></section><section class="panel"><h2>Daftar Nilai</h2>${state.courses.length?`<table class="table"><thead><tr><th>Mata kuliah</th><th>SKS</th><th>Nilai</th><th></th></tr></thead><tbody>${state.courses.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.credits}</td><td><b>${esc(c.grade)}</b></td><td><button class="btn danger" data-course-del="${c.id}">Hapus</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Belum ada nilai.</div>'}</section>`}
function ai(){return `<section class="panel"><h1>Campusly AI</h1><p class="muted">Mode offline: asisten akademik sederhana tanpa API atau Google. Nanti bisa kita sambungkan ke AI API bila diperlukan.</p><form id="aiForm"><div class="field"><label>Apa yang mau dibantu?</label><textarea name="q" required placeholder="Contoh: bantu bikin rencana belajar untuk ujian minggu depan"></textarea></div><div class="actions"><button class="btn primary">Buat saran</button></div></form><div id="aiAnswer" class="ai-answer" style="margin-top:14px">Belum ada pertanyaan.</div></section>`}
function profile(){let p=state.profile;return `<section class="panel"><h1>Profil</h1><p class="muted">Data ini hanya disimpan di browser lo.</p><form id="profileForm" class="form"><div class="field"><label>Nama</label><input name="name" value="${esc(p.name)}" required></div><div class="field"><label>NIM</label><input name="nim" value="${esc(p.nim)}"></div><div class="field"><label>Program studi</label><input name="major" value="${esc(p.major)}"></div><div class="field"><label>Semester</label><input name="semester" type="number" min="1" max="20" value="${esc(p.semester)}"></div><div class="field"><label>Target GPA</label><input name="target" type="number" min="0" max="4" step="0.01" value="${esc(p.target)}"></div><div class="actions full"><button class="btn primary">Simpan Profil</button></div></form></section><section class="panel"><h2>Data Campusly</h2><p class="muted small">Export untuk backup atau import untuk memindahkan data ke browser lain.</p><div class="actions"><button class="btn" id="exportBtn">Export JSON</button><label class="btn">Import JSON<input id="importInput" type="file" accept="application/json" hidden></label><button class="btn danger" id="resetBtn">Reset Semua Data</button></div></section><section class="panel"><h2>Install App</h2><p class="muted">Kalau browser mendukung PWA, Campusly bisa dipasang seperti aplikasi.</p><button class="btn primary install" id="installBtn">Install Campusly</button></section>`}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{current=b.dataset.go;editing=null;location.hash=current;layout()});document.querySelectorAll('[data-task-done]').forEach(b=>b.onclick=()=>{let x=state.tasks.find(x=>x.id===b.dataset.taskDone);x.done=!x.done;save();layout()});document.querySelectorAll('[data-task-del]').forEach(b=>b.onclick=()=>{if(confirm('Hapus task ini?')){state.tasks=state.tasks.filter(x=>x.id!==b.dataset.taskDel);save();layout()}});document.querySelectorAll('[data-task-edit]').forEach(b=>b.onclick=()=>{editing=state.tasks.find(x=>x.id===b.dataset.taskEdit);layout();scrollTo(0,0)});document.querySelectorAll('[data-note-del]').forEach(b=>b.onclick=()=>{if(confirm('Hapus catatan ini?')){state.notes=state.notes.filter(x=>x.id!==b.dataset.noteDel);save();layout()}});document.querySelectorAll('[data-schedule-del]').forEach(b=>b.onclick=()=>{state.schedule=state.schedule.filter(x=>x.id!==b.dataset.scheduleDel);save();layout()});document.querySelectorAll('[data-course-del]').forEach(b=>b.onclick=()=>{state.courses=state.courses.filter(x=>x.id!==b.dataset.courseDel);save();layout()});
$('#taskForm')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),v=Object.fromEntries(f);if(editing)Object.assign(editing,v);else state.tasks.push({...v,id:uid(),done:false,created:Date.now()});editing=null;save();layout()});$('#cancelEdit')?.addEventListener('click',()=>{editing=null;layout()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{$('#taskList').innerHTML=taskList(b.dataset.filter);document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');bind()});
$('#noteForm')?.addEventListener('submit',e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));state.notes.unshift({...v,id:uid(),created:Date.now()});save();layout()});$('#scheduleForm')?.addEventListener('submit',e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));state.schedule.push({...v,id:uid()});save();layout()});$('#courseForm')?.addEventListener('submit',e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));state.courses.push({...v,id:uid(),credits:Number(v.credits)});save();layout()});$('#profileForm')?.addEventListener('submit',e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));v.semester=Number(v.semester);v.target=Number(v.target);state.profile=v;save();layout()});
$('#aiForm')?.addEventListener('submit',e=>{e.preventDefault();let q=new FormData(e.target).get('q').toLowerCase();let answer=q.includes('belajar')||q.includes('ujian')?'Rencana cepat:\n1. Tentukan 3 topik paling penting.\n2. Belajar 45 menit + istirahat 10 menit.\n3. Kerjakan 5 soal latihan.\n4. Catat bagian yang masih salah.\n5. Ulangi besok dengan soal yang berbeda.':q.includes('tugas')?'Prioritaskan tugas berdasarkan deadline dan dampak nilai. Pecah tugas besar menjadi langkah kecil, lalu masukkan deadline-nya ke Tasks Campusly.':'Coba jelaskan tujuan, deadline, dan kondisi lo. Campusly bisa bantu memecahnya menjadi langkah yang lebih kecil.';$('#aiAnswer').textContent=answer});
$('#exportBtn')?.addEventListener('click',()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='campusly-backup.json';a.click();URL.revokeObjectURL(a.href)});$('#importInput')?.addEventListener('change',e=>{let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);state=Object.assign(JSON.parse(JSON.stringify(defaults)),x);save();layout()}catch(_){alert('File backup tidak valid.')}};r.readAsText(file)});$('#resetBtn')?.addEventListener('click',()=>{if(confirm('Reset SEMUA data Campusly?')){state=JSON.parse(JSON.stringify(defaults));save();layout()}});if($('#installBtn')&&deferredPrompt){$('#installBtn').style.display='inline-flex';$('#installBtn').onclick=async()=>{deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('#installBtn').style.display='none'}}}
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;let b=$('#installBtn');if(b)b.style.display='inline-flex'});window.addEventListener('hashchange',()=>{let h=location.hash.slice(1);if(['home','tasks','notes','schedule','gpa','ai','profile'].includes(h)){current=h;editing=null;layout()}});if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});let h=location.hash.slice(1);if(['home','tasks','notes','schedule','gpa','ai','profile'].includes(h))current=h;layout();
})();
</script></body></html>
