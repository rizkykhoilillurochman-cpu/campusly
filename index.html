<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<meta name="description" content="Campusly — workspace kuliah untuk tugas, jadwal, catatan, nilai, fokus, dan AI.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest?v=50">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/styles-v2.css?v=50">
<title>Campusly — Student Workspace</title>
</head>
<body>
<div id="app"></div>
<div id="boot-error" hidden></div>
<script>
window.addEventListener('error',e=>{if(!e.error)return;const x=document.getElementById('boot-error');if(x){x.hidden=false;x.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;font-family:system-ui"><div><h1>Campusly belum berhasil dimuat</h1><p>'+String(e.error.message||e.error)+'</p><button onclick="location.reload()">Muat ulang</button></div></div>'}});
const s=document.createElement('script');s.src='/app-v2.js?v=50';s.onerror=()=>{const x=document.getElementById('boot-error');x.hidden=false;x.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;font-family:system-ui"><div><h1>Campusly belum berhasil dimuat</h1><p>Runtime aplikasi tidak dapat dimuat.</p><button onclick="location.reload()">Muat ulang</button></div></div>'};document.head.appendChild(s);
</script>
</body>
</html>
