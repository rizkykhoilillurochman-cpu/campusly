<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050914">
<meta name="description" content="Campusly — Your College Life, Smarter">
<link rel="manifest" href="/manifest.json?v=18">
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/styles.css?v=12">
<link rel="stylesheet" href="/polish.css?v=3">
<link rel="stylesheet" href="/sidebar-fix.css?v=3">
<link rel="stylesheet" href="/mobile-polish.css?v=6">
<title>Campusly — Your College Life, Smarter</title>
<style id="mobile-emergency-css">
@media(max-width:760px){
  .cmd,.search .cmd{display:none!important;visibility:hidden!important;width:0!important;height:0!important;overflow:hidden!important}
  .sidebar{display:none!important}.main{margin:0!important;width:100%!important;min-width:0!important}
  .mobile-nav{display:grid!important;position:fixed!important;left:10px!important;right:10px!important;bottom:calc(10px + env(safe-area-inset-bottom,0px))!important;height:76px!important;z-index:99999!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:4px!important;padding:6px!important;box-sizing:border-box!important;border-radius:25px!important;background:rgba(7,11,25,.96)!important;border:1px solid rgba(255,255,255,.18)!important;box-shadow:0 22px 75px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.13)!important;backdrop-filter:blur(32px) saturate(185%)!important;-webkit-backdrop-filter:blur(32px) saturate(185%)!important}
  .mobile-nav button{min-width:0!important;width:100%!important;height:100%!important;margin:0!important;border:0!important;border-radius:19px!important;background:transparent!important;color:rgba(235,241,255,.62)!important}
  .mobile-nav button.active{color:#fff!important;background:linear-gradient(145deg,rgba(112,105,255,.42),rgba(55,135,255,.16))!important}
  body{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))!important;overflow-x:hidden!important}
}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<script>
(function(){
  'use strict';
  function clean(){
    if(window.innerWidth<=760){
      document.querySelectorAll('.cmd,.search .cmd').forEach(function(x){x.remove();});
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',clean);else clean();
  window.addEventListener('resize',clean);
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});}).catch(function(){});
    if(window.caches&&caches.keys)caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});}).catch(function(){});
  }
})();
</script>
<script src="/boot-fix.js?v=2"></script>
<script src="/app.js?v=14"></script>
<script src="/liquid-ui.js?v=11"></script>
<script src="/mobile-enhancements.js?v=4"></script>
<script src="/mobile-experience.js?v=6"></script>
<script src="/mobile-force.js?v=2"></script>
<script src="/mobile-hotfix.js?v=2"></script>
<script src="/mobile-final.js?v=1"></script>
</body>
</html>
