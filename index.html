<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="description" content="Campusly — workspace kuliah untuk tugas, jadwal, keuangan, tools, dan AI.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest?v=301">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/campusly-v5.css?v=3">
<title>Campusly</title>
</head>
<body>
<div id="app"><div class="fatal"><div><h1>Campusly lagi nyiapin workspace…</h1><p>Kalau ini lama, muat ulang sekali.</p><button class="btn primary" onclick="location.reload()">Muat ulang</button></div></div></div>
<noscript>Campusly membutuhkan JavaScript untuk berjalan.</noscript>
<script>
(async()=>{
  try{
    if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}
    if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}
  }catch(e){console.warn('Campusly cache cleanup skipped',e)}
  const s=document.createElement('script');s.src='/campusly-v5-final.js?v=3';document.body.appendChild(s);
})();
</script>
</body>
</html>
