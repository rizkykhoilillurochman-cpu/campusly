name: Canonical polish
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, 'chore: apply canonical polish') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch canonical frontend and export engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          js = Path('campusly-v5.js')
          s = js.read_text()

          old_nav = "const mainNav=[['home','home','Beranda'],['schedule','book','Jadwal'],['tasks','tasks','Tugas'],['calendar','calendar','Kalender'],['ai','ai','AI'],['menu','menu','Menu']];"
          new_nav = "const mainNav=[['home','home','Beranda'],['schedule','book','Jadwal'],['tasks','tasks','Tugas'],['calendar','calendar','Kalender'],['ai','ai','AI'],['menu','menu','Menu']];"
          if old_nav not in s:
              raise SystemExit('mainNav anchor not found')

          # Give the home item an explicit class so it cannot disappear through generic sidebar rules.
          s = s.replace(
              "<button class=\"${route===x[0]?'active':''}\" onclick=\"go('${x[0]}')\">${icon(x[1])}<span>${x[2]}</span></button>",
              "<button class=\"${route===x[0]?'active ':''}${x[0]==='home'?'home-nav':''}\" onclick=\"go('${x[0]}')\">${icon(x[1])}<span>${x[2]}</span></button>"
          )

          # Formal academic output prompts: chat stays casual, generated papers/presentations do not.
          s = s.replace(
              "genAI(`Buat draft makalah akademik tentang ${f.get('topic')}, ${f.get('length')}, sitasi ${f.get('cite')}. ${f.get('extra')}. Struktur: judul, abstrak, pendahuluan, pembahasan, kesimpulan, daftar pustaka. Jangan mengarang sumber.`,'paper')",
              "genAI(`Susun makalah akademik formal berbahasa Indonesia tentang ${f.get('topic')}. Panjang ${f.get('length')}; gaya sitasi ${f.get('cite')}. ${f.get('extra')}. Gunakan bahasa baku sesuai KBBI dan kaidah EYD/PUEBI, objektif, akademis, konsisten, tanpa sapaan percakapan, slang, emoji, atau kalimat seperti Yo, tester, gue, lo, atau komentar kepada pengguna. Struktur: judul, abstrak, kata kunci, pendahuluan, pembahasan, kesimpulan, dan daftar pustaka. Jangan mengarang sumber, DOI, URL, data, atau kutipan. Jika sumber perlu diverifikasi, tandai secara jelas.`,'paper')"
          )
          s = s.replace(
              "genAI(`Buat presentasi ${f.get('slides')} slide tentang ${f.get('topic')}. ${f.get('points')}. Format: SLIDE N: Judul lalu bullet - per poin.`,'ppt')",
              "genAI(`Susun materi presentasi akademik ${f.get('slides')} slide tentang ${f.get('topic')}. ${f.get('points')}. Gunakan bahasa Indonesia baku sesuai KBBI dan kaidah EYD/PUEBI. Jangan gunakan sapaan percakapan, slang, emoji, humor, komentar kepada pengguna, atau frasa seperti Yo, tester, gue, atau lo. Materi harus objektif, ringkas, faktual, dan siap ditempatkan pada slide. Format: SLIDE N: Judul lalu bullet - per poin. Sertakan ide visual yang relevan pada tiap slide dalam baris VISUAL: tanpa mengarang sumber.`,'ppt')"
          )

          js.write_text(s)

          server = Path('campusly-production-server.js')
          s = server.read_text()

          # Formal system instruction for generated documents while preserving casual chat mode.
          old = "const style='Kamu adalah Campusly AI, teman kuliah digital untuk mahasiswa Indonesia Gen Z. Jawab santai ala ngobrol pakai gue/lo kalau cocok, tapi jangan lebay. Tetap akurat, jelas, ringkas, dan jangan mengarang fakta.';const task=mode==='paper'?'Untuk makalah: susun akademik, jangan mengarang sumber/DOI/URL, dan tandai referensi yang perlu diverifikasi.':mode==='ppt'?'Untuk PPT: susun materi per slide, fokus pada poin yang bisa dipresentasikan.':mode==='translate'?'Untuk terjemahan: pertahankan makna dan format, tanpa komentar tambahan.':'';"
          new = "const style=mode==='chat'?'Kamu adalah Campusly AI, teman kuliah digital untuk mahasiswa Indonesia Gen Z. Jawab santai ala ngobrol pakai gue/lo kalau cocok, tapi tetap akurat, jelas, ringkas, dan jangan mengarang fakta.':'Kamu adalah penulis akademik profesional berbahasa Indonesia. Gunakan bahasa baku sesuai KBBI dan kaidah EYD/PUEBI, objektif, formal, natural, dan konsisten. Jangan memakai sapaan percakapan, slang, emoji, komentar meta, atau frasa seperti Yo, tester, gue, lo. Jangan mengarang sumber, DOI, URL, kutipan, data, atau fakta.';const task=mode==='paper'?'Untuk makalah: hasilkan naskah akademik yang siap ditempatkan ke dokumen, dengan struktur lengkap, paragraf yang koheren, dan referensi yang hanya boleh berasal dari sumber yang benar-benar diberikan atau dapat diverifikasi.':mode==='ppt'?'Untuk PPT: hasilkan materi per slide yang ringkas dan akademis, dengan judul, poin utama, serta satu baris VISUAL yang menjelaskan gambar/ikon/diagram yang relevan.':mode==='translate'?'Untuk terjemahan: pertahankan makna dan format, tanpa komentar tambahan.':'';"
          if old not in s:
              raise SystemExit('normalizeMessages anchor not found')
          s = s.replace(old, new)

          # Replace the old DOCX builder with a publication-style academic document.
          start = s.index('async function makeDocx(')
          end = s.index('\nfunction makePptx(', start)
          docx_fn = r'''async function makeDocx(text,title){
const lines=String(text||'').replace(/\r/g,'').split('\n');
const children=[];
const runParts=(line)=>{const out=[];const re=/(\*\*[^*]+\*\*|__[^_]+__|\*[^*]+\*|_[^_]+_)/g;let last=0,m;while((m=re.exec(line))){if(m.index>last)out.push(new TextRun({text:line.slice(last,m.index),font:'Times New Roman',size:24}));const token=m[0];const bold=token.startsWith('**')||token.startsWith('__');const italic=!bold;out.push(new TextRun({text:token.slice(bold?2:1,-(bold?2:1)),font:'Times New Roman',size:24,bold,italics:italic}));last=re.lastIndex}if(last<line.length)out.push(new TextRun({text:line.slice(last),font:'Times New Roman',size:24}));return out.length?out:[new TextRun({text:'',font:'Times New Roman',size:24})]};
const para=(line,opts={})=>new Paragraph({alignment:'both',spacing:{line:360,after:0},indent:{firstLine:720},...opts,children:runParts(line)});
let firstContent=true;
for(const raw of lines){const line=raw.trim();if(!line){children.push(new Paragraph({spacing:{after:120},children:[new TextRun({text:'',font:'Times New Roman',size:24})]}));continue}
if(firstContent){children.push(new Paragraph({alignment:'center',spacing:{after:240,line:360},children:[new TextRun({text:line.replace(/^#\s*/,''),font:'Times New Roman',size:28,bold:true})]}));firstContent=false;continue}
if(/^#{1,3}\s+/.test(line)){const m=line.match(/^(#{1,3})\s+(.+)$/);const lvl=m[1].length;children.push(new Paragraph({alignment:lvl===1?'center':'left',spacing:{before:240,after:120,line:360},indent:{firstLine:0},children:[new TextRun({text:m[2],font:'Times New Roman',size:lvl===1?28:24,bold:true})]}));continue}
if(/^(ABSTRAK|ABSTRACT|KATA KUNCI|DAFTAR PUSTAKA|PENDAHULUAN|PEMBAHASAN|KESIMPULAN)\s*:??$/i.test(line)){children.push(new Paragraph({alignment:'left',spacing:{before:240,after:120,line:360},indent:{firstLine:0},children:[new TextRun({text:line,font:'Times New Roman',size:24,bold:true})]}));continue}
if(/^[-*•]\s+/.test(line)){children.push(new Paragraph({alignment:'both',spacing:{line:360,after:0},indent:{left:720,hanging:360},children:runParts(line.replace(/^[-*•]\s+/,''))}));continue}
children.push(para(line));}
if(!children.length)children.push(para(title||'Campusly'));
const doc=new Document({creator:'Campusly',title:title||'Campusly',description:'Makalah akademik dibuat dengan Campusly',styles:{default:{document:{run:{font:'Times New Roman',size:24},paragraph:{spacing:{line:360,after:0}}}}},sections:[{properties:{page:{margin:{top:1701,right:1701,bottom:1701,left:2268}}},children}]});return Packer.toBuffer(doc)}
'''
          s = s[:start] + docx_fn + s[end:]

          # Replace PPT builder with a designed, editable slide layout: title, accent blocks, iconography and visual panel.
          start = s.index('function makePptx(')
          end = s.index('\nasync function proxyCore(', start)
          ppt_fn = r'''function makePptx(text,title){
const pptx=new PptxGenJS();pptx.layout='LAYOUT_WIDE';pptx.author='Campusly';pptx.subject='Presentasi akademik';pptx.title=title||'Campusly';pptx.company='Campusly';pptx.lang='id-ID';pptx.theme={headFontFace:'Aptos Display',bodyFontFace:'Aptos',lang:'id-ID'};
const raw=String(text||'').replace(/\r/g,'');let chunks=raw.split(/\n\s*(?=SLIDE\s*\d+\s*[:.-])/i).filter(Boolean);if(chunks.length<=1)chunks=raw.split(/\n\s*---\s*\n/).filter(Boolean);if(!chunks.length)chunks=[raw];
const escSvg=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const visualSvg=(label,n)=>`<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300"><rect width="520" height="300" rx="28" fill="#EEF1F6"/><rect x="55" y="55" width="410" height="190" rx="18" fill="#FFFFFF" stroke="#D8DEE8"/><circle cx="105" cy="105" r="22" fill="#171A22"/><rect x="145" y="86" width="240" height="12" rx="6" fill="#B8C0CC"/><rect x="145" y="111" width="180" height="10" rx="5" fill="#D8DEE8"/><rect x="90" y="155" width="65" height="55" rx="12" fill="#8B7CFF"/><rect x="175" y="140" width="65" height="70" rx="12" fill="#42D392"/><rect x="260" y="165" width="65" height="45" rx="12" fill="#FFB45B"/><text x="350" y="192" font-family="Arial" font-size="20" font-weight="700" fill="#343941">${escSvg(label||`Visual ${n}`)}</text></svg>`;
chunks.slice(0,20).forEach((chunk,i)=>{const lines=chunk.split('\n').map(x=>x.trim()).filter(Boolean);let heading=i===0?(title||lines.shift()||`Slide ${i+1}`):(lines.shift()||`Slide ${i+1}`);heading=heading.replace(/^SLIDE\s*\d+\s*[:.-]\s*/i,'');const visualLine=lines.find(x=>/^VISUAL\s*:/i.test(x));const bullets=lines.filter(x=>!/^VISUAL\s*:/i.test(x)).map(x=>x.replace(/^[-*•]\s*/,'')).filter(Boolean);const slide=pptx.addSlide();slide.background={color:'FFFFFF'};slide.addShape(pptx.ShapeType.rect,{x:0,y:0,w:.18,h:7.5,fill:{color:'8B7CFF'},line:{color:'8B7CFF'}});slide.addText(heading,{x:.65,y:.55,w:7.1,h:.7,fontFace:'Aptos Display',fontSize:26,bold:true,color:'17191D',margin:0,fit:'shrink'});slide.addText(`0${i+1}`.slice(-2),{x:11.7,y:.58,w:.8,h:.35,fontFace:'Aptos',fontSize:13,bold:true,color:'8B7CFF',align:'right',margin:0});slide.addShape(pptx.ShapeType.line,{x:.65,y:1.38,w:6.9,h:0,line:{color:'D8DEE8',width:1}});const arr=(bullets.length?bullets:['Materi dapat disesuaikan kembali sesuai kebutuhan akademik.']).slice(0,6).map(x=>({text:x,options:{bullet:{indent:16},breakLine:true}}));slide.addText(arr,{x:.8,y:1.7,w:6.45,h:4.65,fontFace:'Aptos',fontSize:18,color:'343941',margin:.02,paraSpaceAfterPt:10,breakLine:false,fit:'shrink'});slide.addImage({data:`data:image/svg+xml;base64,${Buffer.from(visualSvg(visualLine?visualLine.replace(/^VISUAL\s*:/i,'').trim():'Ilustrasi materi',i+1)).toString('base64')}`,x:7.7,y:2.0,w:4.8,h:2.77});slide.addShape(pptx.ShapeType.roundRect,{x:7.7,y:5.0,w:4.8,h:.62,rectRadius:.08,fill:{color:'F5F6F8'},line:{color:'D8DEE8'}});slide.addText(visualLine?visualLine.replace(/^VISUAL\s*:/i,'').trim():'Ringkasan visual materi',{x:7.92,y:5.18,w:4.35,h:.22,fontSize:9,color:'697386',margin:0,fit:'shrink'});slide.addText('Campusly',{x:.65,y:7.05,w:2,h:.25,fontSize:8,color:'8A919B',margin:0})});return pptx.write({outputType:'nodebuffer'})}
'''
          s = s[:start] + ppt_fn + s[end:]
          server.write_text(s)
          PY
      - name: Commit canonical changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add campusly-v5.js campusly-production-server.js
          git diff --cached --quiet && exit 0
          git commit -m "chore: apply canonical polish"
          git push
