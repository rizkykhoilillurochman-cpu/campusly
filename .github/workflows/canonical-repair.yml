name: Campusly canonical repair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair canonical frontend and export runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js = Path('campusly-v5.js')
          s = js.read_text()

          old = "function downloadBlob(b,n){const blob=b instanceof Blob?b:new Blob([b]);if(!blob.size)throw Error('File hasil export kosong.');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=n;a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},60000)}"
          new = """function downloadBlob(b,n){const blob=b instanceof Blob?b:new Blob([b]);if(!blob.size)throw Error('File hasil export kosong.');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=n;a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},60000)}
          function downloadExport(path,payload,name){
            const frameName='campusly-download-frame';
            let frame=document.getElementById(frameName);
            if(!frame){frame=document.createElement('iframe');frame.id=frameName;frame.name=frameName;frame.hidden=true;document.body.appendChild(frame)}
            const form=document.createElement('form');form.method='POST';form.action=path;form.target=frameName;form.style.display='none';
            Object.entries(payload).forEach(([k,v])=>{const input=document.createElement('input');input.type='hidden';input.name=k;input.value=String(v??'');form.appendChild(input)});
            document.body.appendChild(form);form.submit();setTimeout(()=>form.remove(),1500);toast(`${name} sedang diunduh.`)
          }"""
          if old not in s:
              raise SystemExit('downloadBlob anchor not found')
          s=s.replace(old,new,1)

          reps={
          "async function exportDOCX(text,title){try{await downloadExport('/api/export/docx',{content:text,title},'campusly-makalah.docx','application/vnd.openxmlformats-officedocument.wordprocessingml.document');toast('Word berhasil diunduh.')}catch(e){toast(e.message)}}":"function exportDOCX(text,title){try{downloadExport('/api/export/docx',{content:text,title},'campusly-makalah.docx')}catch(e){toast(e.message)}}",
          "async function exportPDF(text,title){try{await downloadExport('/api/export/pdf',{content:text,title},'campusly-makalah.pdf','application/pdf');toast('PDF berhasil diunduh.')}catch(e){toast(e.message)}}":"function exportPDF(text,title){try{downloadExport('/api/export/pdf',{content:text,title},'campusly-makalah.pdf')}catch(e){toast(e.message)}}",
          "async function exportPPT(text,title){try{await downloadExport('/api/export/ppt',{content:text,title},'campusly-presentasi.pptx','application/vnd.openxmlformats-officedocument.presentationml.presentation');toast('PPTX berhasil diunduh.')}catch(e){toast(e.message)}}":"function exportPPT(text,title){try{downloadExport('/api/export/ppt',{content:text,title},'campusly-presentasi.pptx')}catch(e){toast(e.message)}}"
          }
          for a,b in reps.items():
              if a not in s: raise SystemExit('export function not found')
              s=s.replace(a,b,1)

          old_icon="function icon(n){return `<span class=\"ui-icon\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">${paths[n]||paths.menu}</svg></span>`}"
          new_icon="function icon(n){const p=paths[n]||paths.menu;return `<span class=\"ui-icon\" data-icon=\"${esc(n)}\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">${p}</svg></span>`}"
          if old_icon in s:s=s.replace(old_icon,new_icon,1)
          js.write_text(s)

          server=Path('campusly-production-server.js')
          s=server.read_text()
          s=s.replace("const {Document,Packer,Paragraph,TextRun}=require('docx');","const {Document,Packer,Paragraph,TextRun,Footer,PageNumber}=require('docx');",1)
          marker="async function readJson(req){const b=await readBody(req);try{return JSON.parse(b.toString('utf8')||'{}')}catch{throw Object.assign(new Error('JSON tidak valid'),{status:400})}}"
          add="""async function readJson(req){const b=await readBody(req);try{return JSON.parse(b.toString('utf8')||'{}')}catch{throw Object.assign(new Error('JSON tidak valid'),{status:400})}}
          async function readPayload(req){
            const b=await readBody(req);const raw=b.toString('utf8');
            const type=String(req.headers['content-type']||'').toLowerCase();
            if(type.includes('application/json')){try{return JSON.parse(raw||'{}')}catch{throw Object.assign(new Error('JSON tidak valid'),{status:400})}}
            if(type.includes('application/x-www-form-urlencoded')){return Object.fromEntries(new URLSearchParams(raw))}
            throw Object.assign(new Error('Format request export tidak didukung.'),{status:415})
          }"""
          if marker not in s: raise SystemExit('readJson marker not found')
          s=s.replace(marker,add,1)

          start=s.index('function makePdf(')
          end=s.index('function inlineRuns(',start)
          pdf=r'''function pdfEscape(s){return String(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}
          function pdfWrap(text,max=78){const out=[];for(const raw of String(text||'').replace(/\r/g,'').split('\n')){let line=raw.trim();if(!line){out.push({text:'',style:'body'});continue}let style='body';if(/^#{1,3}\s+/.test(line)){style='heading';line=line.replace(/^#{1,3}\s+/,'')}else if(/^(ABSTRAK|KATA KUNCI|PENDAHULUAN|PEMBAHASAN|KESIMPULAN|DAFTAR PUSTAKA)\s*:??$/i.test(line)){style='heading'}else if(/^[-*•]\s+/.test(line)){style='bullet';line='• '+line.replace(/^[-*•]\s+/,'')}const words=line.split(/\s+/);let cur='';for(const w of words){const next=cur?cur+' '+w:w;if(next.length>max){if(cur)out.push({text:cur,style});cur=w}else cur=next}if(cur)out.push({text:cur,style})}return out}
          function makePdf(text,title){const lines=pdfWrap(text,78);const perPage=31,pages=[];for(let i=0;i<lines.length;i+=perPage)pages.push(lines.slice(i,i+perPage));if(!pages.length)pages.push([]);const objects=[];const add=x=>{objects.push(x);return objects.length};const fonts={body:add('<< /Type /Font /Subtype /Type1 /BaseFont /Times-Roman >>'),bold:add('<< /Type /Font /Subtype /Type1 /BaseFont /Times-Bold >>'),italic:add('<< /Type /Font /Subtype /Type1 /BaseFont /Times-Italic >>')};const pageIds=[];for(let p=0;p<pages.length;p++){const stream=['BT'];let y=770;stream.push('/F2 15 Tf 72 770 Td',`(${pdfEscape(p===0?(title||'Campusly Makalah'):title||'Campusly Makalah')}) Tj`);y=738;for(const item of pages[p]){const size=item.style==='heading'?12:11;const font=item.style==='heading'?'/F2':item.style==='bullet'?'/F1':'/F1';stream.push(`${font} ${size} Tf`,`1 0 0 1 72 ${y} Tm`,`(${pdfEscape(item.text)}) Tj`);y-=item.style==='heading'?30:24}stream.push('ET');const body=stream.join('\n');const content=add(`<< /Length ${Buffer.byteLength(body)} >>\nstream\n${body}\nendstream`);const page=add(`<< /Type /Page /Parent PAGES /MediaBox [0 0 595 842] /Resources << /Font << /F1 ${fonts.body} 0 R /F2 ${fonts.bold} 0 R /F3 ${fonts.italic} 0 R >> >> /Contents ${content} 0 R >>`);pageIds.push(page)}const pagesId=add(`<< /Type /Pages /Kids [${pageIds.map(x=>x+' 0 R').join(' ')}] /Count ${pageIds.length} >>`);pageIds.forEach(id=>objects[id-1]=objects[id-1].replace('PAGES',pagesId+' 0 R'));const catalog=add(`<< /Type /Catalog /Pages ${pagesId} 0 R >>`);const chunks=[Buffer.from('%PDF-1.4\n%âãÏÓ\n')];const offsets=[0];let off=chunks[0].length;objects.forEach((obj,i)=>{offsets.push(off);const b=Buffer.from(`${i+1} 0 obj\n${obj}\nendobj\n`);chunks.push(b);off+=b.length});const xref=off;let tail=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;for(let i=1;i<offsets.length;i++)tail+=`${String(offsets[i]).padStart(10,'0')} 00000 n \n`;tail+=`trailer\n<< /Size ${objects.length+1} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF\n`;chunks.push(Buffer.from(tail));return Buffer.concat(chunks)}
          '''
          s=s[:start]+pdf+s[end:]

          start=s.index('async function makeDocx(')
          end=s.index('function svgData(',start)
          doc=r'''async function makeDocx(text,title){const lines=String(text||'').replace(/\r/g,'').split('\n'),children=[];let first=true;for(const raw of lines){const line=raw.trim();if(!line){children.push(new Paragraph({spacing:{after:0,line:480},children:[new TextRun({text:'',font:'Times New Roman',size:24})]}));continue}const md=line.match(/^#{1,3}\s+(.+)$/);const section=/^(ABSTRAK|KATA KUNCI|PENDAHULUAN|PEMBAHASAN|KESIMPULAN|DAFTAR PUSTAKA)\s*:??$/i.test(line);if(first){children.push(new Paragraph({alignment:'center',spacing:{after:360,line:480},children:[new TextRun({text:line.replace(/^#\s*/,''),font:'Times New Roman',size:28,bold:true})]}));first=false;continue}if(md||section){children.push(new Paragraph({alignment:'left',spacing:{before:240,after:120,line:480},indent:{firstLine:0},children:[new TextRun({text:(md?md[1]:line),font:'Times New Roman',size:24,bold:true})]}));continue}if(/^[-*•]\s+/.test(line)){children.push(new Paragraph({alignment:'both',spacing:{line:480,after:0},indent:{left:720,hanging:360},children:inlineRuns(line.replace(/^[-*•]\s+/,''))}));continue}children.push(new Paragraph({alignment:'both',spacing:{line:480,after:0},indent:{firstLine:720},children:inlineRuns(line)}))}if(!children.length)children.push(new Paragraph({alignment:'center',children:[new TextRun({text:title||'Campusly',font:'Times New Roman',size:28,bold:true})]}));const doc=new Document({creator:'Campusly',title:title||'Campusly',description:'Makalah akademik Campusly',styles:{default:{document:{run:{font:'Times New Roman',size:24},paragraph:{spacing:{line:480,after:0}}}}},sections:[{properties:{page:{margin:{top:1440,right:1440,bottom:1440,left:1440}}},footers:{default:new Footer({children:[new Paragraph({alignment:'center',children:[new TextRun({text:'Halaman ',font:'Times New Roman',size:20}),PageNumber.CURRENT]})]})},children}]});return Packer.toBuffer(doc)}
          '''
          s=s[:start]+doc+s[end:]

          start=s.index('function makePptx(')
          end=s.index('function serveStatic(',start)
          ppt=r'''function svgData(kind='chart'){const variants={chart:'<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420"><rect width="640" height="420" rx="34" fill="#F3F5F9"/><rect x="54" y="50" width="532" height="320" rx="24" fill="#fff" stroke="#D8DEE8"/><circle cx="112" cy="110" r="28" fill="#171A22"/><rect x="160" y="92" width="250" height="16" rx="8" fill="#B9C1CD"/><rect x="160" y="122" width="190" height="12" rx="6" fill="#E0E4EA"/><path d="M110 306L205 240L280 270L382 172L510 216" fill="none" stroke="#8B7CFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="205" cy="240" r="9" fill="#8B7CFF"/><circle cx="382" cy="172" r="9" fill="#42D392"/><circle cx="510" cy="216" r="9" fill="#FFB45B"/></svg>',process:'<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420"><rect width="640" height="420" rx="34" fill="#F3F5F9"/><circle cx="150" cy="210" r="70" fill="#8B7CFF"/><circle cx="320" cy="210" r="70" fill="#42D392"/><circle cx="490" cy="210" r="70" fill="#FFB45B"/><path d="M220 210h55M390 210h55" stroke="#171A22" stroke-width="12" stroke-linecap="round"/><path d="M130 205l20 20 35-45M300 205l20 20 35-45M470 205l20 20 35-45" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>',people:'<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420"><rect width="640" height="420" rx="34" fill="#F3F5F9"/><circle cx="220" cy="150" r="55" fill="#8B7CFF"/><circle cx="420" cy="150" r="55" fill="#42D392"/><path d="M130 330c20-90 160-90 180 0M330 330c20-90 160-90 180 0" fill="#FFB45B"/><circle cx="220" cy="150" r="20" fill="#fff"/><circle cx="420" cy="150" r="20" fill="#fff"/></svg>'};return `data:image/svg+xml;base64,${Buffer.from(variants[k]||variants.chart).toString('base64')}`}
          function makePptx(text,title){const pptx=new PptxGenJS();pptx.layout='LAYOUT_WIDE';pptx.author='Campusly';pptx.company='Campusly';pptx.title=title||'Campusly Presentasi';pptx.subject='Presentasi akademik';pptx.lang='id-ID';const raw=String(text||'').replace(/\r/g,'');let chunks=raw.split(/\n\s*(?=SLIDE\s*\d+\s*[:.-])/i).filter(Boolean);if(chunks.length<=1)chunks=raw.split(/\n\s*---\s*\n/).filter(Boolean);if(!chunks.length)chunks=[raw];chunks.slice(0,20).forEach((chunk,i)=>{const lines=chunk.split('\n').map(x=>x.trim()).filter(Boolean);let heading=(lines.shift()||`Slide ${i+1}`).replace(/^SLIDE\s*\d+\s*[:.-]\s*/i,'');const visual=lines.find(x=>/^VISUAL\s*:/i.test(x));const bullets=lines.filter(x=>!/^VISUAL\s*:/i.test(x)).map(x=>x.replace(/^[-*•]\s*/,'')).filter(Boolean).slice(0,6);const slide=pptx.addSlide();slide.background={color:'FFFFFF'};slide.addShape(pptx.ShapeType.rect,{x:0,y:0,w:13.333,h:.18,fill:{color:'8B7CFF'},line:{color:'8B7CFF'}});slide.addText(heading,{x:.7,y:.55,w:8.4,h:.75,fontFace:'Aptos Display',fontSize:28,bold:true,color:'17191D',margin:0,fit:'shrink'});slide.addText(String(i+1).padStart(2,'0'),{x:11.7,y:.6,w:.8,h:.35,fontFace:'Aptos',fontSize:13,bold:true,color:'8B7CFF',align:'right',margin:0});slide.addShape(pptx.ShapeType.roundRect,{x:.65,y:1.55,w:6.3,h:4.75,rectRadius:.08,fill:{color:'F7F8FA'},line:{color:'E0E4EA',width:1}});slide.addText((bullets.length?bullets:['Materi dapat disesuaikan kembali sesuai kebutuhan akademik.']).map(x=>({text:x,options:{bullet:{indent:16},breakLine:true}})),{x:.95,y:1.95,w:5.65,h:3.9,fontFace:'Aptos',fontSize:18,color:'343941',margin:.02,paraSpaceAfterPt:11,breakLine:false,fit:'shrink'});const kind=i%3===0?'chart':i%3===1?'process':'people';slide.addShape(pptx.ShapeType.roundRect,{x:7.45,y:1.55,w:5.2,h:4.75,rectRadius:.08,fill:{color:'F3F5F9'},line:{color:'E0E4EA',width:1}});slide.addImage({data:svgData(kind),x:7.75,y:2.0,w:4.6,h:3.0,altText:visual||'Ilustrasi materi akademik'});slide.addText(visual?visual.replace(/^VISUAL\s*:/i,'').trim():'Ilustrasi materi akademik',{x:7.85,y:5.25,w:4.4,h:.55,fontFace:'Aptos',fontSize:10,color:'697386',margin:0,fit:'shrink'});slide.addText('Campusly',{x:.7,y:7.05,w:2,h:.25,fontFace:'Aptos',fontSize:8,color:'8A919B',margin:0});slide.addShape(pptx.ShapeType.line,{x:.7,y:6.75,w:11.9,h:0,line:{color:'E0E4EA',width:1}})});return pptx.write({outputType:'nodebuffer'})}
          '''
          s=s[:start]+ppt+s[end:]

          old="if(req.method==='POST'&&url.pathname==='/api/export/pdf'){const b=await readJson(req);if(!String(b.content||'').trim())return json(res,400,{error:'Isi makalah kosong.'});const pdf=makePdf(b.content,b.title||'Campusly Makalah');res.writeHead(200,{'Content-Type':'application/pdf','Content-Disposition':'attachment; filename=\"campusly-makalah.pdf\"','Content-Length':pdf.length,'Cache-Control':'no-store'});return res.end(pdf)}if(req.method==='POST'&&url.pathname==='/api/export/docx'){const b=await readJson(req);if(!String(b.content||'').trim())return json(res,400,{error:'Isi makalah kosong.'});const docx=await makeDocx(b.content,b.title||'Campusly Makalah');res.writeHead(200,{'Content-Type':'application/vnd.openxmlformats-officedocument.wordprocessingml.document','Content-Disposition':'attachment; filename=\"campusly-makalah.docx\"','Content-Length':docx.length,'Cache-Control':'no-store'});return res.end(docx)}if(req.method==='POST'&&url.pathname==='/api/export/ppt'){const b=await readJson(req);if(!String(b.content||'').trim())return json(res,400,{error:'Materi PPT kosong.'});const pptx=await makePptx(b.content,b.title||'Campusly Presentasi');res.writeHead(200,{'Content-Type':'application/vnd.openxmlformats-officedocument.presentationml.presentation','Content-Disposition':'attachment; filename=\"campusly-presentasi.pptx\"','Content-Length':pptx.length,'Cache-Control':'no-store'});return res.end(pptx)}"
          new="""if(req.method==='POST'&&url.pathname==='/api/export/pdf'){const b=await readPayload(req);if(!String(b.content||'').trim())return json(res,400,{error:'Isi makalah kosong.'});const pdf=makePdf(b.content,b.title||'Campusly Makalah');res.writeHead(200,{'Content-Type':'application/pdf','Content-Disposition':'attachment; filename=\"campusly-makalah.pdf\"','Content-Length':pdf.length,'Cache-Control':'no-store'});return res.end(pdf)}if(req.method==='POST'&&url.pathname==='/api/export/docx'){const b=await readPayload(req);if(!String(b.content||'').trim())return json(res,400,{error:'Isi makalah kosong.'});const docx=await makeDocx(b.content,b.title||'Campusly Makalah');res.writeHead(200,{'Content-Type':'application/vnd.openxmlformats-officedocument.wordprocessingml.document','Content-Disposition':'attachment; filename=\"campusly-makalah.docx\"','Content-Length':docx.length,'Cache-Control':'no-store'});return res.end(docx)}if(req.method==='POST'&&url.pathname==='/api/export/ppt'){const b=await readPayload(req);if(!String(b.content||'').trim())return json(res,400,{error:'Materi PPT kosong.'});const pptx=await makePptx(b.content,b.title||'Campusly Presentasi');res.writeHead(200,{'Content-Type':'application/vnd.openxmlformats-officedocument.presentationml.presentation','Content-Disposition':'attachment; filename=\"campusly-presentasi.pptx\"','Content-Length':pptx.length,'Cache-Control':'no-store'});return res.end(pptx)}"""
          if old not in s: raise SystemExit('export endpoint block not found')
          s=s.replace(old,new,1)
          server.write_text(s)

          css=Path('campusly-v5.css');c=css.read_text();guard='.app>aside>.home-nav .ui-icon{display:inline-grid!important;visibility:visible!important;opacity:1!important;color:inherit}'
          extra=guard+'.app>aside>.home-nav .ui-icon svg{display:block!important;width:20px!important;height:20px!important;min-width:20px!important;min-height:20px!important;stroke:currentColor!important;fill:none!important;opacity:1!important}'
          if guard in c and '.home-nav .ui-icon svg{' not in c:c=c.replace(guard,extra,1)
          css.write_text(c)

          idx=Path('index.html');h=idx.read_text().replace('stable-20260930-0700','stable-20260930-1100');idx.write_text(h)
          PY
          node --check campusly-v5.js
          node --check campusly-production-server.js
          npm install --omit=dev --no-audit --no-fund
          npm test
          git rm .github/workflows/canonical-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add campusly-v5.js campusly-production-server.js campusly-v5.css index.html
          git commit -m 'fix: finish canonical document exports and navigation'
          git push
