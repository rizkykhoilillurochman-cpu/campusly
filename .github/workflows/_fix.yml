name: _fix
on: push
jobs:
  fix:
    if: github.event.head_commit.message != 'fix: repair canonical modal outputs and remove duplicate tools entry'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch canonical frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('campusly-v5.js')
          s=p.read_text()
          reps={
            '<div class="modal-body">${body}</div>':'<form class="modal-body" onsubmit="return false">${body}</form>',
            '<button onclick="go(\'tools\')">${icon(\'settings\')}<b>Tools kuliah</b><small>Hitung, terjemahin, konversi, fokus</small></button>':'',
            "out.value='Campusly lagi nyusun makalah… jangan ditinggal 😎'":"out.textContent='Campusly lagi nyusun makalah… jangan ditinggal 😎'",
            "out.value=text;$('#paper-actions').innerHTML":"out.textContent=text;$('#paper-actions').innerHTML",
            "catch(e){out.value='⚠️ '+e.message}":"catch(e){out.textContent='⚠️ '+e.message}",
            '<div id="paper-out" class="result output-box">Draft bakal muncul di sini.</div>':'<div id="paper-out" class="result output-box">Draft bakal muncul di sini.</div><div id="paper-actions" class="actions"></div>',
            "out.value=text;$('#ppt-actions').innerHTML":"out.textContent=text;$('#ppt-actions').innerHTML",
            '<div id="ppt-out" class="result output-box">Materi slide bakal muncul di sini.</div>':'<div id="ppt-out" class="result output-box">Materi slide bakal muncul di sini.</div><div id="ppt-actions" class="actions"></div>',
            "const out=$('#scan-out');out.textContent='Lagi baca soal… bentar ya 😎'":"const out=$('#scan-out');out.textContent='Lagi baca soal… bentar ya 😎'",
            "out.value=d.text":"out.textContent=d.text",
            "const f=new FormData($('.modal-body')),r=(Number(f.get('a'))*Number(f.get('aw'))+Number(f.get('b'))*Number(f.get('bw')))/100;$('.modal-body [name=\"output\"]').value=`Nilai akhir: ${r.toFixed(2)}`":"const f=new FormData($('.modal-body')),r=(Number(f.get('a'))*Number(f.get('aw'))+Number(f.get('b'))*Number(f.get('bw')))/100;$('#gr').textContent=`Nilai akhir: ${r.toFixed(2)}`",
          }
          for a,b in reps.items():
              if a not in s: print('MISSING:',a[:100])
              s=s.replace(a,b)
          p.write_text(s)
          PY
          node --check campusly-v5.js
          grep -nE 'function modal|function scheduleModal|function gradeCalc|function scanModal|function paperModal|function pptModal' campusly-v5.js
      - name: Commit canonical fix and remove temporary workflow
        run: |
          git config user.name 'Campusly Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add campusly-v5.js
          git commit -m 'fix: repair canonical modal outputs and remove duplicate tools entry'
          git rm .github/workflows/_fix.yml .github/workflows/_diag.yml
          git commit -m 'chore: remove temporary fixer workflows'
          git push origin HEAD:fix-clean-single-source
