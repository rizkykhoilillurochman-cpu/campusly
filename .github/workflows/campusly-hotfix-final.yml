name: campusly-hotfix-final
"on":
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply final navigation and download fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('campusly-v5.js')
          s=p.read_text()
          old='<button class="${route===x[0]?\'active\':\'\'}" onclick="go(\'${x[0]}\')">${icon(x[1])}<span>${x[2]}</span></button>'
          new='<button class="nav-item ${route===x[0]?\'active\':\'\'} ${x[0]===\'home\'?\'home-nav\':\'\'}" onclick="go(\'${x[0]}\')">${icon(x[1])}<span>${x[2]}</span></button>'
          if old not in s: raise SystemExit('navigation template not found')
          s=s.replace(old,new)
          old_dl="function downloadBlob(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}"
          new_dl="function downloadBlob(b,n){const blob=b instanceof Blob?b:new Blob([b]);if(!blob.size)throw Error('File hasil export kosong.');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=n;a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},60000)}\nasync function downloadExport(path,payload,name,contentType){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify(payload)});if(!r.ok){const d=await r.json().catch(()=>null);throw Error(d?.error||`Export gagal (${r.status})`)}const blob=await r.blob();const ct=(r.headers.get('content-type')||'').toLowerCase();if(!blob.size)throw Error('Server mengembalikan file kosong.');if(contentType&&!ct.includes(contentType))throw Error(`Format file tidak sesuai (${ct||'tanpa content-type'}).`);downloadBlob(blob,name)}"
          if old_dl not in s: raise SystemExit('downloadBlob implementation not found')
          s=s.replace(old_dl,new_dl)
          reps=[
          ("async function exportDOCX(text,title){try{const r=await fetch('/api/export/docx',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:text,title})});if(!r.ok)throw Error('Export Word gagal');downloadBlob(await r.blob(),'campusly-makalah.docx')}catch(e){toast(e.message)}}", "async function exportDOCX(text,title){try{await downloadExport('/api/export/docx',{content:text,title},'campusly-makalah.docx','application/vnd.openxmlformats-officedocument.wordprocessingml.document');toast('Word berhasil diunduh.')}catch(e){toast(e.message)}}"),
          ("async function exportPDF(text,title){try{const r=await fetch('/api/export/pdf',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:text,title})});if(!r.ok)throw Error('Export PDF gagal');downloadBlob(await r.blob(),'campusly-makalah.pdf')}catch(e){toast(e.message)}}", "async function exportPDF(text,title){try{await downloadExport('/api/export/pdf',{content:text,title},'campusly-makalah.pdf','application/pdf');toast('PDF berhasil diunduh.')}catch(e){toast(e.message)}}"),
          ("async function exportPPT(text,title){try{const r=await fetch('/api/export/ppt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:text,title})});if(!r.ok)throw Error('Export PPT gagal');downloadBlob(await r.blob(),'campusly-presentasi.pptx')}catch(e){toast(e.message)}}", "async function exportPPT(text,title){try{await downloadExport('/api/export/ppt',{content:text,title},'campusly-presentasi.pptx','application/vnd.openxmlformats-officedocument.presentationml.presentation');toast('PPTX berhasil diunduh.')}catch(e){toast(e.message)}}")]
          for old,new in reps:
              if old not in s: raise SystemExit('export function not found')
              s=s.replace(old,new)
          old_home="home:'M3 10.5 12 3l9 7.5v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z'"
          new_home="home:'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z'"
          if old_home in s: s=s.replace(old_home,new_home)
          p.write_text(s)
          c=Path('campusly-v5.css');css=c.read_text();marker='.app aside>button:hover,.app aside>button.active,.aside-bottom button:hover{background:var(--surface2);color:var(--text)}';add=marker+'.app>aside>.home-nav{display:flex!important;visibility:visible!important;opacity:1!important}.app>aside>.home-nav .ui-icon{display:inline-grid!important;visibility:visible!important;opacity:1!important;color:inherit}'
          if '.app>aside>.home-nav{' not in css:
              if marker not in css: raise SystemExit('sidebar css marker not found')
              css=css.replace(marker,add,1)
          c.write_text(css)
          p=Path('index.html');p.write_text(p.read_text().replace('clean-final-20260930','stable-20260930-0700'))
          PY
          node --check campusly-v5.js
          node --check campusly-production-server.js
          git rm .github/workflows/campusly-hotfix-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add campusly-v5.js campusly-v5.css index.html
          git commit -m 'fix: finalize canonical navigation and downloads [campusly-hotfix-final]'
          git push
