name: Campusly CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify runtime
        run: node --version

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Canonical repair
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [ ! -f .github/workflows/canonical-repair.yml ]; then
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          js=Path('campusly-v5.js'); s=js.read_text()
          old="function downloadBlob(b,n){const blob=b instanceof Blob?b:new Blob([b]);if(!blob.size)throw Error('File hasil export kosong.');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=n;a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},60000)}"
          new="""function downloadBlob(b,n){const blob=b instanceof Blob?b:new Blob([b]);if(!blob.size)throw Error('File hasil export kosong.');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=n;a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},60000)}
          function downloadExport(path,payload,name){const frameName='campusly-download-frame';let frame=document.getElementById(frameName);if(!frame){frame=document.createElement('iframe');frame.id=frameName;frame.name=frameName;frame.hidden=true;document.body.appendChild(frame)}const form=document.createElement('form');form.method='POST';form.action=path;form.target=frameName;form.style.display='none';Object.entries(payload).forEach(([k,v])=>{const i=document.createElement('input');i.type='hidden';i.name=k;i.value=String(v??'');form.appendChild(i)});document.body.appendChild(form);form.submit();setTimeout(()=>form.remove(),1500);toast(`${name} sedang diunduh.`)}"""
          if old not in s: raise SystemExit('download helper not found')
          s=s.replace(old,new,1)
          reps={
          "async function exportDOCX(text,title){try{await downloadExport('/api/export/docx',{content:text,title},'campusly-makalah.docx','application/vnd.openxmlformats-officedocument.wordprocessingml.document');toast('Word berhasil diunduh.')}catch(e){toast(e.message)}}":"function exportDOCX(text,title){try{downloadExport('/api/export/docx',{content:text,title},'campusly-makalah.docx')}catch(e){toast(e.message)}}",
          "async function exportPDF(text,title){try{await downloadExport('/api/export/pdf',{content:text,title},'campusly-makalah.pdf','application/pdf');toast('PDF berhasil diunduh.')}catch(e){toast(e.message)}}":"function exportPDF(text,title){try{downloadExport('/api/export/pdf',{content:text,title},'campusly-makalah.pdf')}catch(e){toast(e.message)}}",
          "async function exportPPT(text,title){try{await downloadExport('/api/export/ppt',{content:text,title},'campusly-presentasi.pptx','application/vnd.openxmlformats-officedocument.presentationml.presentation');toast('PPTX berhasil diunduh.')}catch(e){toast(e.message)}}":"function exportPPT(text,title){try{downloadExport('/api/export/ppt',{content:text,title},'campusly-presentasi.pptx')}catch(e){toast(e.message)}}"
          }
          for a,b in reps.items():
            if a not in s: raise SystemExit('export function not found')
            s=s.replace(a,b,1)
          js.write_text(s)
          css=Path('campusly-v5.css'); c=css.read_text(); guard='.app>aside>.home-nav .ui-icon{display:inline-grid!important;visibility:visible!important;opacity:1!important;color:inherit}'
          extra=guard+'.app>aside>.home-nav .ui-icon svg{display:block!important;width:20px!important;height:20px!important;min-width:20px!important;min-height:20px!important;stroke:currentColor!important;fill:none!important;opacity:1!important}'
          if guard in c and '.home-nav .ui-icon svg{' not in c:c=c.replace(guard,extra,1)
          css.write_text(c)
          server=Path('campusly-production-server.js'); s=server.read_text()
          marker="async function readJson(req){const b=await readBody(req);try{return JSON.parse(b.toString('utf8')||'{}')}catch{throw Object.assign(new Error('JSON tidak valid'),{status:400})}}"
          payload=marker+"\nasync function readPayload(req){const b=await readBody(req);const raw=b.toString('utf8');const type=String(req.headers['content-type']||'').toLowerCase();if(type.includes('application/json'))return JSON.parse(raw||'{}');if(type.includes('application/x-www-form-urlencoded'))return Object.fromEntries(new URLSearchParams(raw));throw Object.assign(new Error('Format request export tidak didukung.'),{status:415})}"
          if marker not in s: raise SystemExit('readJson not found')
          s=s.replace(marker,payload,1).replace("await readJson(req)","await readPayload(req)")
          server.write_text(s)
          idx=Path('index.html');idx.write_text(idx.read_text().replace('stable-20260930-0700','stable-20260930-1200'))
          PY
          node --check campusly-v5.js
          node --check campusly-production-server.js
          npm test
          git rm .github/workflows/canonical-repair.yml .github/workflows/canonical-repair2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add campusly-v5.js campusly-production-server.js campusly-v5.css index.html
          git commit -m 'fix: finish canonical downloads and export request handling'
          git push

      - name: Syntax check
        run: npm run check

      - name: Integration smoke test
        run: npm test
