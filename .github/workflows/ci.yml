name: Campusly CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify runtime
        run: node --version

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Integration smoke test
        run: npm test

      - name: Docker build
        run: docker build --tag campusly:ci .
