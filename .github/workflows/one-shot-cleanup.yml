name: Campusly one-shot cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.head_commit.message != 'chore: remove one-shot cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch canonical frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('campusly-v5.js');s=p.read_text()
          s=s.replace('reminders:[],notifications:[],','').replace("'Yang penting buat kuliah, langsung kelihatan.'","'Kuliah lebih rapi, hidup lebih santai.'").replace("'Fitur tambahan + identitas developer, ringkas biar nggak makan tempat.'","'Tools pendukung yang belum ada di bar utama.'")
          s=s.replace("[['schedule','book','Jadwal kuliah','Atur kelas mingguan'],['tools'","[['tools'").replace(",[\'reminders\',\'clock\',\'Reminder\',\'Pengingat tugas & agenda\']",'')
          s=re.sub(r'function reminders\(\)\{.*?\}\nfunction settings','function settings',s,flags=re.S)
          s=re.sub(r'function reminderModal\(.*?\nfunction deleteReminder\(.*?\n','',s,flags=re.S)
          s=s.replace('reminders,settings','settings').replace('window.reminderModal=reminderModal;window.toggleReminder=toggleReminder;window.deleteReminder=deleteReminder;','')
          s=s.replace('<button onclick="go(\'schedule\')">${icon(\'book\')}<b>Jadwal kuliah</b><small>Lihat kelas mingguan</small></button>','')
          old="['7','8','9','/','4','5','6','*','1','2','3','-','0','.','(',')','sin','cos','tan','log','√','^','π','C','=']";new="['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','(',')','+','sin','cos','tan','log','√','^','π','⌫','C','=']";s=s.replace(old,new).replace("if(k==='C'){o.value='';return}if(k==='=')","if(k==='C'){o.value='';return}if(k==='⌫'){o.value=o.value.slice(0,-1);return}if(k==='=')").replace("replace(/π/g,'Math.PI')","replace(/π/g,'Math.PI').replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-')")
          s=s.replace('<div id="conv" class="result"></div>","${area(\'Output\',\'out\',\'\',\'Hasil konversi bakal muncul di sini...\')}").replace("$('#conv').textContent=`Hasil: ${r}`","$('[name=\"out\"]').value=`Hasil: ${r}`")
          s=s.replace('<div id="gr" class="result"></div>","${area(\'Output\',\'out\',\'\',\'Nilai akhir bakal muncul di sini...\')}").replace("$('#gr').textContent=`Nilai akhir: ${r.toFixed(2)}`","$('[name=\"out\"]').value=`Nilai akhir: ${r.toFixed(2)}`")
          s=s.replace('<div id="paper-out" class="result"></div>","${area(\'Output makalah\',\'out\',\'\',\'Hasil makalah bakal muncul di sini...\')}").replace("out.innerHTML=`<pre>${esc(text)}</pre><div class=\"result-actions\"><button class=\"btn\" onclick=\"downloadText('makalah.md',window.__paperText)\">Simpan .md</button><button class=\"btn primary\" onclick=\"exportPDF(window.__paperText,window.__paperTitle)\">Download PDF</button></div>`","out.value=text")
          s=s.replace('<div id="ppt-out" class="result"></div>","${area(\'Output PPT\',\'out\',\'\',\'Materi slide bakal muncul di sini...\')}").replace("out.innerHTML=`<pre>${esc(text)}</pre><div class=\"result-actions\"><button class=\"btn primary\" onclick=\"exportPPT(window.__pptText,window.__pptTitle)\">Download PPTX</button></div>`","out.value=text")
          s=s.replace('<div id="scan-out" class="result"></div>","${area(\'Output hasil scan\',\'scanout\',\'\',\'Hasil penjelasan soal bakal muncul di sini...\')}").replace("const out=$('#scan-out');out.textContent=","const out=$('[name=\"scanout\"]');out.value=").replace('out.textContent=d.text','out.value=d.text').replace("out.textContent='⚠️ '+e.message","out.value='⚠️ '+e.message")
          pat=r'function translator\(\)\{.*?\nfunction science'
          rep="""function translator(){const l=[['Indonesia','Indonesia'],['English','English'],['Jepang','Japanese'],['Korea','Korean'],['Mandarin','Chinese'],['Arab','Arabic'],['Spanyol','Spanish'],['Prancis','French'],['Jerman','German']];modal('Translator',`<div class=\"form\">${select('Bahasa asal','from','Indonesia',l)}${select('Terjemahkan ke','to','English',l)}${area('Teks input','text','','Tulis teks di sini...')}${area('Output terjemahan','out','','Hasil terjemahan bakal muncul di sini...')}</div>`,async()=>{const f=new FormData($('.modal-body')),o=$('[name=\"out\"]');o.value='Lagi nerjemahin…';try{o.value=await genAI(`Terjemahkan dari ${f.get('from')} ke ${f.get('to')}. Hanya hasil terjemahan.\\n${f.get('text')}`,'translate')}catch(e){o.value='⚠️ '+e.message}},'Translate')}\nfunction science"""
          s=re.sub(pat,rep,s,flags=re.S)
          p.write_text(s)
          PY
          node --check campusly-v5.js
      - name: Commit cleanup
        run: |
          rm -f .github/workflows/one-shot-cleanup.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add campusly-v5.js .github/workflows/one-shot-cleanup.yml
          git commit -m "feat: finish canonical UX cleanup"
          git push
