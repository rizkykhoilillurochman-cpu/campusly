name: Campusly output controls fixer
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python3 scripts/fix_output_controls.py
      - name: Validate and commit
        run: |
          node --check campusly-v5.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add campusly-v5.js campusly-v5.css
          git commit -m "fix: restore tool outputs and controls" || true
          git rm .github/workflows/fix-output-controls-main.yml scripts/fix_output_controls.py
          git commit -m "chore: remove one-shot output fixer"
          git push
